name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke-test the pinned DataHub MCP server
        run: |
          python - <<'PY'
          from importlib.metadata import version

          from fastmcp import FastMCP
          from mcp_server_datahub.mcp_server import mcp

          expected = {
              "fastapi": "0.141.1",
              "fastmcp": "3.4.0",
              "python-multipart": "0.0.32",
              "sse-starlette": "3.4.6",
              "starlette": "1.3.1",
          }
          observed = {package: version(package) for package in expected}
          if observed != expected:
              raise SystemExit(f"resolved live stack drifted: {observed!r}")
          if not isinstance(mcp, FastMCP):
              raise SystemExit(f"unexpected MCP server type: {type(mcp).__name__}")
          print(f"DataHub MCP server import passed with pinned live stack: {observed}")
          PY

      - name: Compile Python sources
        run: python -m compileall -q -f src tests scripts

      - name: Check source hygiene
        run: python scripts/check_source_hygiene.py

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run proof-tampering regressions from source
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_audit.py" -v
          python -m unittest discover -s tests -p "test_replay.py" -v
          python -m unittest discover -s tests -p "test_postgres_validation.py" -v

      - name: Check dependency consistency
        run: python -m pip check

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the pinned dependency auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-audit.txt

      # PYSEC-2026-3447 (setuptools) is fixed in 83.0.0, but every published
      # acryl-datahub release, including the current 1.6.0.17, requires
      # setuptools<82.0.0. The patched version is therefore unreachable through
      # any upstream version, and pinning it makes the tree unresolvable.
      # setuptools is a build-time transitive dependency here; RippleProof does
      # not invoke easy_install or process untrusted package metadata at
      # runtime. Re-test this ignore whenever acryl-datahub relaxes the cap.
      - name: Audit runtime and validation dependency trees
        run: >-
          python -m pip_audit
          -r requirements.txt
          -r requirements-validation.txt
          --ignore-vuln PYSEC-2026-3447
          --progress-spinner off

  dbt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt
          python -m pip check

      - name: Validate the canonical four-root campaign with dbt and DuckDB
        env:
          PYTHONPATH: src
        run: |
          python -m lineage_agent.dbt_validation \
            --bundle examples/generated-ripple-proof-resolved \
            --target-repo examples/dbt_project \
            --target-repo examples/dbt_finance_project \
            --target-repo examples/dbt_growth_project \
            --target-repo examples/dbt_operations_primary \
            --target-repo examples/dbt_operations_shadow

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache the explicit PostgreSQL validation image
        run: docker pull postgres:16

      - name: Validate the canonical source rename and rollback
        env:
          PYTHONPATH: src
        run: >-
          python -m lineage_agent.postgres_validation
          --bundle examples/generated-ripple-proof-resolved

      - name: Prove an existing destination column is refused
        env:
          PYTHONPATH: src
        run: >-
          python scripts/ci_postgres_collision.py
          --bundle examples/generated-ripple-proof-resolved
