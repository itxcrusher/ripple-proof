[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple-proof"
version = "0.1.0"
description = "Lineage-aware PostgreSQL column renames and downstream dbt repair campaigns with DataHub MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Muhammad Hassaan Javed" }]
dependencies = []

[project.optional-dependencies]
live = [
  "acryl-datahub==1.5.0.6",
  "mcp-server-datahub==0.6.0",
  # fastmcp 3.4.5 splits into a fastmcp-slim meta-package that exposes no
  # importable `fastmcp.FastMCP`, which breaks mcp-server-datahub. 3.4.0 is the
  # newest release that imports correctly and accepts the patched Starlette.
  "fastmcp==3.4.0",
  "fastapi==0.141.1",
  "python-dotenv==1.2.2",
  "mcp==1.28.1",
  "openai==2.46.0",
  "ruamel.yaml==0.18.17",
  # Starlette 1.3.1 clears the published multipart, FileResponse, and
  # host-header advisories that affected the 0.x line.
  "starlette==1.3.1",
  "python-multipart==0.0.32",
  "sse-starlette==3.4.6",
]
validation = [
  "dbt-core==1.9.10",
  "dbt-duckdb==1.9.6",
  "ruamel.yaml==0.18.17",
]

[project.scripts]
ripple-proof = "lineage_agent.cli:main"

[project.urls]
Repository = "https://github.com/itxcrusher/ripple-proof"

[tool.setuptools.packages.find]
where = ["src"]
