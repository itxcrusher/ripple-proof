name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Check dependency consistency
        run: python -m pip check

  dbt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Validate preserve campaign with dbt and DuckDB
        env:
          PYTHONPATH: src
        run: >-
          python -m lineage_agent.dbt_validation
          --bundle examples/generated
          --target-repo examples/dbt_project
          --target-repo examples/dbt_finance_project

      - name: Validate propagate campaign with dbt and DuckDB
        env:
          PYTHONPATH: src
        run: >-
          python -m lineage_agent.dbt_validation
          --bundle examples/generated-propagate
          --target-repo examples/dbt_project
          --target-repo examples/dbt_finance_project

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache the explicit PostgreSQL validation image
        run: docker pull postgres:16

      - name: Validate the source rename and rollback in disposable PostgreSQL
        env:
          PYTHONPATH: src
        run: >-
          python -m lineage_agent.postgres_validation
          --bundle examples/generated-rich-propagate-resolved
