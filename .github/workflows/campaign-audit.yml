name: Campaign audit

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captured-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Audit the checked RippleProof campaign
        uses: ./.github/actions/audit-campaign
        with:
          bundle: examples/generated-ripple-proof-resolved
